<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guard home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 14px; background-color: {{t.bg}}; background-image: {{t.fabric}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif;">

<div style="display: flex; justify-content: space-between; align-items: center;">
<div style="display: flex; align-items: center; gap: 10px;">
<span style="width: 40px; height: 40px; border-radius: 999px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></span>
<span style="display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 600;">Musa</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: {{t.muted}};">ATIBA GATE</span></span>
</div>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; font-size: 13px;"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="{{t.warn}}"></circle></svg>No network · still works</span>
</div>

<a href="Guard-Gate.dc.html" style="flex: 1 1 0; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: {{t.accent}}; color: {{t.onAccent}}; border-radius: 28px;">
<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"></rect><circle cx="8.5" cy="8" r="1" fill="currentColor"></circle><circle cx="12" cy="8" r="1" fill="currentColor"></circle><circle cx="15.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8.5" cy="12" r="1" fill="currentColor"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle><circle cx="15.5" cy="12" r="1" fill="currentColor"></circle><circle cx="8.5" cy="16" r="1" fill="currentColor"></circle><circle cx="12" cy="16" r="1" fill="currentColor"></circle><circle cx="15.5" cy="16" r="1" fill="currentColor"></circle></svg>
<span style="font-size: 26px; font-weight: 700; line-height: 1.1;">Visitor has code</span>
</a>

<a href="Guard-Call.dc.html" style="flex: 1 1 0; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: {{t.surface}}; color: {{t.text}}; border-radius: 28px;">
<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
<span style="font-size: 26px; font-weight: 700; line-height: 1.1;">Phone call</span>
</a>

<a href="#" style="flex: 1 1 0; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: {{t.surface}}; color: {{t.text}}; border-radius: 28px;">
<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5 M10 8l-4 4 4 4 M6 12h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 26px; font-weight: 700; line-height: 1.1;">Visitor leaving</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: {{t.muted}};">37 INSIDE</span></span>
</a>

<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 999px; border: 1px solid {{t.line}}; color: {{t.text}}; font-size: 16px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z M12 10v4 M12 17v.5" fill="none" stroke="{{t.no}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Emergency numbers
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const night = this.props.night ?? true;
    const t = night
      ? { bg: '#111111', surface: '#1C1C1C', text: '#F4F4F2', muted: '#A8A8A6', line: 'rgba(244,244,242,0.10)', accent: '#F4F4F2', onAccent: '#111111', warn: '#F5C542', no: '#FF5A4E' }
      : { bg: '#F2F2F0', surface: '#FFFFFF', text: '#141414', muted: '#4A4A48', line: 'rgba(20,20,20,0.10)', accent: '#141414', onAccent: '#FFFFFF', warn: '#A16207', no: '#D92D20' };
    t.fabric = night ? 'repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.35) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.05), transparent 65%)' : 'none';
    return { t };
  }
}
</script>
</body>
</html>
