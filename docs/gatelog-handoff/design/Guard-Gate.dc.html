<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guard code result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 18px; background-color: {{t.bg}}; background-image: {{t.fabric}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif;">

<div style="display: flex; justify-content: space-between; align-items: center;">
<a href="Guard-Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{t.surface}}; color: {{t.text}}; border-radius: 999px;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; font-size: 13px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>Reading aloud</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 8px;">
<span style="width: 112px; height: 112px; border-radius: 999px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center;"><svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="font-size: 28px; font-weight: 700;">Code is correct</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px; background: {{t.surface}}; border-radius: 24px; text-align: center;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 600; letter-spacing: 0.02em;">14B</span>
<span style="font-size: 16px; color: {{t.muted}};">Adeniyi Close</span>
<span style="font-size: 22px; font-weight: 600; padding-top: 6px;">Tunde Bakare</span>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: transparent; color: {{t.text}}; border: 1px solid {{t.line}}; border-radius: 999px; font-family: Inter, sans-serif; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l2-6h14l2 6v3H3z M7 18v2 M17 18v2 M3 15h18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="7" cy="15" r="1" fill="currentColor"></circle><circle cx="17" cy="15" r="1" fill="currentColor"></circle></svg>
Photo of car (if any)
</button>

<div style="margin-top: auto; display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
<a href="Guard-Home.dc.html" style="min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: {{t.accent}}; color: {{t.onAccent}}; border-radius: 24px; font-size: 22px; font-weight: 700;">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Let in</a>
<a href="Guard-Home.dc.html" style="min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: {{t.surface}}; color: {{t.no}}; border-radius: 24px; font-size: 18px; font-weight: 700;">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path></svg>No</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const night = this.props.night ?? true;
    const t = night
      ? { bg: '#111111', surface: '#1C1C1C', text: '#F4F4F2', muted: '#A8A8A6', line: 'rgba(244,244,242,0.10)', accent: '#F4F4F2', onAccent: '#111111', no: '#FF5A4E' }
      : { bg: '#F2F2F0', surface: '#FFFFFF', text: '#141414', muted: '#4A4A48', line: 'rgba(20,20,20,0.10)', accent: '#141414', onAccent: '#FFFFFF', no: '#D92D20' };
    t.fabric = night ? 'repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.35) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.05), transparent 65%)' : 'none';
    return { t };
  }
}
</script>
</body>
</html>
