<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guard phone call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 16px; background-color: {{t.bg}}; background-image: {{t.fabric}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif;">

<div style="display: flex; justify-content: space-between; align-items: center;">
<a href="Guard-Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{t.surface}}; color: {{t.text}}; border-radius: 999px;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<div style="display: flex; gap: 6px;" aria-label="Step 2 of 2">
<span style="width: 28px; height: 6px; border-radius: 999px; background: {{t.accent}};"></span>
<span style="width: 28px; height: 6px; border-radius: 999px; background: {{t.accent}};"></span>
</div>
<span style="width: 48px;"></span>
</div>

<div style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; background: {{t.surface}}; border-radius: 24px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 600;">14B</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; color: {{t.muted}};">Adeniyi Close</span><span style="font-size: 17px; font-weight: 600;">Mrs Adeyemi</span></span>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 999px; border: 1px solid {{t.line}}; font-size: 15px;">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="{{t.accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>House called back</span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{t.muted}};">0:34</span>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 64px; background: {{t.surface}}; color: {{t.text}}; border: 0; border-radius: 24px; font-family: Inter, sans-serif; font-size: 18px; font-weight: 600;">
<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M5 11a7 7 0 0 0 14 0 M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
Say the visitor's name
</button>

<div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding-top: 8px;">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
<span style="font-size: 26px; font-weight: 700;">Did they say yes?</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<a href="Guard-Home.dc.html" style="min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: {{t.accent}}; color: {{t.onAccent}}; border-radius: 28px; font-size: 24px; font-weight: 700;">
<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Yes</a>
<a href="Guard-Home.dc.html" style="min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: {{t.surface}}; color: {{t.no}}; border-radius: 28px; font-size: 24px; font-weight: 700;">
<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path></svg>No</a>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button type="button" style="min-height: 56px; background: transparent; color: {{t.text}}; border: 1px solid {{t.line}}; border-radius: 999px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600;">No answer</button>
<button type="button" style="min-height: 56px; background: transparent; color: {{t.warn}}; border: 1px solid {{t.line}}; border-radius: 999px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600;">Call supervisor</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const night = this.props.night ?? true;
    const t = night
      ? { bg: '#111111', surface: '#1C1C1C', text: '#F4F4F2', muted: '#A8A8A6', line: 'rgba(244,244,242,0.10)', accent: '#F4F4F2', onAccent: '#111111', no: '#FF5A4E', warn: '#F5C542' }
      : { bg: '#F2F2F0', surface: '#FFFFFF', text: '#141414', muted: '#4A4A48', line: 'rgba(20,20,20,0.10)', accent: '#141414', onAccent: '#FFFFFF', no: '#D92D20', warn: '#A16207' };
    t.fabric = night ? 'repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.35) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.05), transparent 65%)' : 'none';
    return { t };
  }
}
</script>
</body>
</html>
