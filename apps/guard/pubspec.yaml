name: gatelog_guard
description: "Gatelog gate phone app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  drift: ">=2.30.0 <2.35.0"
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.2
  timezone: ^0.11.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  sqlite3: 3.4.0
  camera: ^0.12.0+2
  image: ^4.12.0
  geolocator: ^14.0.1
  nfc_manager: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

# package:sqlite3 3.x bundles SQLite through build hooks. Selecting the SQLCipher build here
# makes drift's database file encrypted at rest (the key lives in flutter_secure_storage).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
